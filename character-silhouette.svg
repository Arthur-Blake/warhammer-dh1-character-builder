<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900" role="img" aria-labelledby="title desc">
  <title id="title">Силуэт персонажа Dark Heresy</title>
  <desc id="desc">Фронтальный силуэт человека в длинном готическом плаще и лёгкой броне.</desc>
  <defs>
    <linearGradient id="coat" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#30291e"/>
      <stop offset=".48" stop-color="#1b1915"/>
      <stop offset="1" stop-color="#100f0d"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1">
      <stop stop-color="#68502d"/>
      <stop offset=".5" stop-color="#b18b4c"/>
      <stop offset="1" stop-color="#554127"/>
    </linearGradient>
  </defs>

